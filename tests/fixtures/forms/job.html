<body>

<header><strong>示例科技招聘</strong> · 首页 · 校园招聘</header>
<main>
  <h1>后端开发工程师</h1>

    <h3>岗位职责</h3>

    <ul><li>2027 届本科及以上，计算机相关专业</li><li>熟悉 Go 或 Java，了解 MySQL</li></ul>
  </div>

  <button type="button">立即投递</button>
</main>
<script>
  const d = new Date(Date.now() + 2 * 86400000);
  document.getElementById('dl').textContent = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
