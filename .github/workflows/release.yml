# 推送 v* 标签时，把 release/DraftFill.zip 发布到 GitHub Releases（附安装说明）
name: 发布安装包

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          **安装**：下载下面的 `DraftFill.zip` 并解压 → 浏览器打开 `chrome://extensions`（Edge 是 `edge://extensions`）→ 打开「开发者模式」→「加载已解压的扩展程序」，选解压出来的 `DraftFill` 文件夹。装好会自动打开使用教程。

          压缩包里附了一张《安装使用教程》图片，可以直接转发给同学。Chrome、Edge 通用。功能说明见 [README](https://github.com/${{ github.repository }}#readme)。
          NOTES
          gh release create "${{ github.ref_name }}" release/DraftFill.zip docs/install-card.png \
            --title "网申助手 DraftFill ${{ github.ref_name }}" --notes-file notes.md --latest
